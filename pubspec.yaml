name: kitahack_hackathon
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  flutter_dotenv: ^5.1.0
  cloud_firestore: ^5.6.5
  firebase_core: ^3.12.1
  flutter:
    sdk: flutter
  provider: ^6.1.2
  firebase_auth: ^5.5.1
  fluttertoast: ^8.2.12
  flutter_gemini: ^3.0.0
  google_generative_ai: ^0.4.6
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env

  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
        - asset: fonts/Poppins-Bold.ttf
          weight: 500
        - asset: fonts/Poppins-Bold.ttf
          weight: 400
        - asset: fonts/Poppins-Bold.ttf
          weight: 600
